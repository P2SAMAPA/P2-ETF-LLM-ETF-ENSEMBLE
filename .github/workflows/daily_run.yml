name: LLM ETF Ensemble Daily Run

on:
  schedule:
    - cron: '30 0 * * 1-6'  # 00:30 UTC, Monday-Saturday
  workflow_dispatch:  # Manual trigger

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run LLM ETF Ensemble
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python trainer.py
    
    - name: Upload results to HuggingFace Dataset
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Results are already uploaded by trainer.py
        echo "✅ Results uploaded to HuggingFace dataset"
    
    - name: Trigger Streamlit Cloud Deploy
      run: |
        # Trigger Streamlit Cloud to redeploy
        curl -X POST "https://api.streamlit.io/v1/deploy" \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "P2SAMAPA/P2-ETF-LLM-ETF-ENSEMBLE",
            "branch": "main",
            "main_file": "streamlit_app.py"
          }' || echo "Streamlit Cloud webhook failed (may need manual setup)"
