name: LLM ETF Ensemble Daily Run

on:
  schedule:
    - cron: '30 0 * * 1-6'  # 00:30 UTC, Monday-Saturday
  workflow_dispatch:  # Manual trigger

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Debug - Check if secrets are available
      run: |
        echo "HF_TOKEN exists: ${{ secrets.HF_TOKEN != '' }}"
        echo "OLLAMA_API_KEY exists: ${{ secrets.OLLAMA_API_KEY != '' }}"
        echo "OPENROUTER_API_KEY exists: ${{ secrets.OPENROUTER_API_KEY != '' }}"
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    
    - name: Run LLM ETF Ensemble
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python trainer.py
    
    - name: Upload results artifact
      uses: actions/upload-artifact@v4
      with:
        name: llm-ensemble-results
        path: llm_etf_ensemble_*.json
        retention-days: 30
